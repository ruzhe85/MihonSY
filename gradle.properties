android.nonTransitiveRClass=false

kotlin.code.style=official

# Configuration should be synced with [/gradle/build-logic/gradle.properties]
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true

# MihonSY: dependencies from jitpack (unifile, image-decoder) are compiled against
# compileSdk 37, which is not available in the official Android SDK repository
# (latest is 36.1). The AAR metadata check would fail the build; those libraries
# do not use API-37-only runtime features, so the check can be safely skipped.
android.experimental.disableCompileSdkChecks=true
