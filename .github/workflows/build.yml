name: Build MihonSY APK

"on":
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components (platform 36 + build-tools + NDK + CMake)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Write local.properties
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          cat local.properties

      - name: Decode signing keystore from secrets
        run: |
          mkdir -p keystore
          echo "${{ secrets.MIHONSY_KEYSTORE_BASE64 }}" | base64 -d > keystore/mihonmod.jks
          ls -la keystore/

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Build release APK
        env:
          MIHONSY_STORE_PASSWORD: ${{ secrets.MIHONSY_KEYSTORE_PASSWORD }}
          MIHONSY_KEY_PASSWORD: ${{ secrets.MIHONSY_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease -Pdisable-code-shrink --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          ls -la app/build/outputs/apk/release/
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs app/build/outputs/apk/release/app-arm64-v8a-release.apk | head -5

      - name: Upload APKs (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: mihonsy-apk
          path: |
            app/build/outputs/apk/release/*.apk
          retention-days: 30

      # MihonSY: automatically publish a GitHub Release with the built APKs.
      # The release tag/name come from versionCode/versionName in app/build.gradle.kts,
      # and the body is extracted from the matching section of CHANGELOG.en.md.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "versionName=$VERSION_NAME versionCode=$VERSION_CODE"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

          TAG="v${VERSION_NAME}"

          # Delete any existing release/tag with the same name so rebuilds can republish.
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          git tag -d "$TAG" 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true

          # Extract release notes: from "## v<version>" until the next "## " heading
          # (fall back to "## v1.0.1" style). Use awk on the changelog.
          NOTES_FILE=$(mktemp)
          awk -v ver="v${VERSION_NAME}" '
            /^## / {
              if (section) exit
              if (index($0, ver) > 0) { section=1; next }
            }
            section { print }
          ' CHANGELOG.en.md > "$NOTES_FILE" || true
          if [ ! -s "$NOTES_FILE" ]; then
            echo "MihonSY ${VERSION_NAME} (${VERSION_CODE})" > "$NOTES_FILE"
            echo "" >> "$NOTES_FILE"
            echo "Built automatically from the master branch." >> "$NOTES_FILE"
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "MihonSY ${VERSION_NAME} (${VERSION_CODE})" \
            --notes-file "$NOTES_FILE" \
            app/build/outputs/apk/release/*.apk

          echo "Published release $TAG"
