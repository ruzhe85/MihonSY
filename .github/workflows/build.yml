name: Build MihonSY APK

"on":
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      mode:
        description: "发布模式: ci = 测试版(默认, 固定 tag ci), formal = 正式版 (vX.Y.Z)"
        required: false
        default: ci
        type: choice
        options:
          - ci
          - formal

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # MihonSY: cache Gradle dependencies — the dependency download is the bulk
      # of the 12-18 min build; caching cuts rebuilds to roughly half.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', '**/gradle.properties') }}
          restore-keys: |
            gradle-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components (platform 36 + build-tools + NDK + CMake)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Write local.properties
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          cat local.properties

      - name: Decode signing keystore from secrets
        run: |
          mkdir -p keystore
          echo "${{ secrets.MIHONSY_KEYSTORE_BASE64 }}" | base64 -d > keystore/mihonmod.jks
          ls -la keystore/

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Build release APK
        env:
          MIHONSY_STORE_PASSWORD: ${{ secrets.MIHONSY_KEYSTORE_PASSWORD }}
          MIHONSY_KEY_PASSWORD: ${{ secrets.MIHONSY_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease -Pdisable-code-shrink --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          ls -la app/build/outputs/apk/release/
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs app/build/outputs/apk/release/app-arm64-v8a-release.apk | head -5

      # MihonSY: resolve publish mode.
      # - push: HEAD commit message containing "[release]" (or 正式版) → formal,
      #   everything else → ci (test build, fixed tag "ci").
      # - workflow_dispatch: use the "mode" input.
      # Both modes sign with the SAME keystore (mihonmod.jks decoded above), so a
      # CI build and a formal build can overwrite each other on a device.
      - name: Resolve publish mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
          else
            MSG=$(git log -1 --format=%s)
            if echo "$MSG" | grep -qiE '\[release\]|正式版'; then
              MODE=formal
            else
              MODE=ci
            fi
          fi
          echo "mode=$MODE"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Upload APKs (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: mihonsy-apk
          path: |
            app/build/outputs/apk/release/*.apk
          retention-days: 30

      # MihonSY CI release: fixed tag "ci", always marked prerelease so it never
      # becomes the GitHub Latest release. APKs are named mihonsy-ci-{abi}.apk.
      - name: Publish CI release (test build)
        if: steps.mode.outputs.mode == 'ci'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          APK_DIR=app/build/outputs/apk/release
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          SHA=$(git rev-parse --short HEAD)

          cd "$APK_DIR"
          for apk in *.apk; do
            abi=$(echo "$apk" | sed -E 's/^app-(.+)-release\.apk$/\1/')
            [ "$abi" = "$apk" ] && abi=universal
            mv "$apk" "mihonsy-ci-${abi}.apk"
          done
          ls -la

          # Delete any existing CI release/tag so rebuilds republish in place.
          cd "$GITHUB_WORKSPACE"
          gh release delete ci --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          git tag -d ci 2>/dev/null || true
          git push origin ":refs/tags/ci" 2>/dev/null || true

          gh release create ci \
            --repo "$GITHUB_REPOSITORY" \
            --title "MihonSY CI Build" \
            --prerelease \
            --notes "CI build (${VERSION_NAME}) from commit \`${SHA}\` — 测试版, 非正式发布.

            Signature: same keystore as formal releases (mihonmod.jks)." \
            "${APK_DIR}"/mihonsy-ci-*.apk

          echo "Published CI release (tag ci)"

      # MihonSY formal release: versioned tag v{x.y.z} + changelog body,
      # becomes the GitHub Latest release.
      - name: Publish formal release
        if: steps.mode.outputs.mode == 'formal'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          APK_DIR=app/build/outputs/apk/release
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)

          echo "versionName=$VERSION_NAME versionCode=$VERSION_CODE"

          # Rename APKs to mihonsy-{x.y.z}-{abi}.apk (full version name).
          cd "$APK_DIR"
          for apk in *.apk; do
            abi=$(echo "$apk" | sed -E 's/^app-(.+)-release\.apk$/\1/')
            [ "$abi" = "$apk" ] && abi=universal
            mv "$apk" "mihonsy-${VERSION_NAME}-${abi}.apk"
          done
          ls -la

          TAG="v${VERSION_NAME}"

          # Delete any existing release/tag with the same name so rebuilds can republish.
          cd "$GITHUB_WORKSPACE"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          git tag -d "$TAG" 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true

          # Extract the version's section from a changelog file.
          extract_section() {
            awk -v ver="v${VERSION_NAME}" '
              /^## / {
                if (section) exit
                if (index($0, ver) > 0) { section=1; next }
              }
              section { print }
            ' "$1"
          }

          NOTES_FILE=$(mktemp)
          {
            echo "## 中文 / Chinese"
            echo ""
            extract_section CHANGELOG.md || true
            echo ""
            echo "---"
            echo ""
            echo "## English"
            echo ""
            extract_section CHANGELOG.en.md || true
          } > "$NOTES_FILE"

          # Fallback if neither section matched.
          if ! grep -qE '^## ' "$NOTES_FILE"; then
            {
              echo "MihonSY ${VERSION_NAME}"
              echo ""
              echo "Built automatically from the master branch."
            } > "$NOTES_FILE"
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "MihonSY ${VERSION_NAME}" \
            --notes-file "$NOTES_FILE" \
            "${APK_DIR}/mihonsy-${VERSION_NAME}-"*.apk

          echo "Published release $TAG"
