name: Build MihonSY APK

"on":
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components (platform 36 + build-tools + NDK + CMake)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Write local.properties
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          cat local.properties

      - name: Decode signing keystore from secrets
        run: |
          mkdir -p keystore
          echo "${{ secrets.MIHONSY_KEYSTORE_BASE64 }}" | base64 -d > keystore/mihonmod.jks
          ls -la keystore/

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Build release APK
        env:
          MIHONSY_STORE_PASSWORD: ${{ secrets.MIHONSY_KEYSTORE_PASSWORD }}
          MIHONSY_KEY_PASSWORD: ${{ secrets.MIHONSY_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease -Pdisable-code-shrink --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          ls -la app/build/outputs/apk/release/
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs app/build/outputs/apk/release/app-arm64-v8a-release.apk | head -5

      # MihonSY: rename APKs to mihonsy-{version}-{abi}.apk before uploading so the
      # artifact is as readable as a release (arm64-v8a / armeabi-v7a / x86 / x86_64 / universal).
      - name: Rename APKs for artifact
        run: |
          set -e
          APK_DIR=app/build/outputs/apk/release
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          cd "$APK_DIR"
          for apk in *.apk; do
            abi=$(echo "$apk" | sed -E 's/^app-(.+)-release\.apk$/\1/')
            [ "$abi" = "$apk" ] && abi=universal
            mv "$apk" "mihonsy-${VERSION_NAME}-${abi}.apk"
          done
          ls -la

      - name: Upload APKs (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: mihonsy-apk
          path: |
            app/build/outputs/apk/release/mihonsy-*.apk
          retention-days: 30

      # MihonSY: automatically publish a GitHub Release with the built APKs.
      # - APK files are renamed to {app-name}-{x.y.z}-{abi}.apk
      #   (e.g. mihonsy-1.0.1-arm64-v8a.apk, full version name)
      # - Release tag/title use versionName from app/build.gradle.kts
      # - Release body contains both Chinese (CHANGELOG.md) and English
      #   (CHANGELOG.en.md) sections for the current version.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          APK_DIR=app/build/outputs/apk/release
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)

          echo "versionName=$VERSION_NAME versionCode=$VERSION_CODE"

          # Rename APKs to mihonsy-{x.y.z}-{abi}.apk (full version name).
          # Only touch the original app-*-release.apk files — the artifact step
          # already renamed them, and re-running this on mihonsy-* files would
          # error ('mv: same file').
          cd "$APK_DIR"
          for apk in app-*-release.apk; do
            abi=$(echo "$apk" | sed -E 's/^app-(.+)-release\.apk$/\1/')
            [ "$abi" = "$apk" ] && abi=universal
            mv "$apk" "mihonsy-${VERSION_NAME}-${abi}.apk"
          done
          ls -la

          TAG="v${VERSION_NAME}"

          # Delete any existing release/tag with the same name so rebuilds can republish.
          cd "$GITHUB_WORKSPACE"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          git tag -d "$TAG" 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true

          # Extract the version's section from a changelog file.
          extract_section() {
            awk -v ver="v${VERSION_NAME}" '
              /^## / {
                if (section) exit
                if (index($0, ver) > 0) { section=1; next }
              }
              section { print }
            ' "$1"
          }

          NOTES_FILE=$(mktemp)
          {
            echo "## 中文 / Chinese"
            echo ""
            extract_section CHANGELOG.md || true
            echo ""
            echo "---"
            echo ""
            echo "## English"
            echo ""
            extract_section CHANGELOG.en.md || true
          } > "$NOTES_FILE"

          # Fallback if neither section matched.
          if ! grep -qE '^## ' "$NOTES_FILE"; then
            {
              echo "MihonSY ${VERSION_NAME}"
              echo ""
              echo "Built automatically from the master branch."
            } > "$NOTES_FILE"
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "MihonSY ${VERSION_NAME}" \
            --notes-file "$NOTES_FILE" \
            "${APK_DIR}/mihonsy-${VERSION_NAME}-"*.apk

          echo "Published release $TAG"
