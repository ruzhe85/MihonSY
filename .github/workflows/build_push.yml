name: Release Builder
on:
  push:
   branches:
    - 'release'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release app
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@v7

      - name: Setup Android SDK
        run: |
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "build-tools;29.0.3"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@v5

      # SY -->
      - name: Write google-services.json
        uses: DamianReeves/write-file-action@v1.3
        with:
          path: app/google-services.json
          contents: ${{ secrets.GOOGLE_SERVICES_TEXT }}
          write-mode: overwrite

      - name: Write client_secrets.json
        uses: DamianReeves/write-file-action@v1.3
        with:
          path: app/src/main/assets/client_secrets.json
          contents: ${{ secrets.CLIENT_SECRETS_TEXT }}
          write-mode: overwrite
      # SY <--

      - name: Check code format
        run: ./gradlew spotlessCheck

      - name: Build app
        # MihonSY: AI 引擎（ncnn/Vulkan + QNN/HTP）只有 arm64 实现，
        # 故正式发版出 arm64 + 合并包（见 app/build.gradle.kts 的 splits 块）。
        run: ./gradlew assembleRelease -PmihonsyAbi=arm64-v8a -PmihonsyUniversal=true

      - name: Run unit tests
        run: ./gradlew test

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '35.0.1'

      - name: Clean up build artifacts
        run: |
          set -e

          # MihonSY: 按实际产物改名，不再硬编码 4 个 ABI
          # （AI 引擎只有 arm64，见 app/build.gradle.kts 的 splits 块）。
          for apk in app/build/outputs/apk/release/app-*-release-unsigned-signed.apk; do
            base=$(basename "$apk")
            abi=$(echo "$base" | sed -E 's/^app-(.+)-release-unsigned-signed\.apk$/\1/')
            [ "$abi" = "$base" ] && abi=universal
            if [ "$abi" = "universal" ]; then
              out="TachiyomiSY.apk"
            else
              out="TachiyomiSY-${abi}.apk"
            fi
            mv "$apk" "$out"
            echo "→ $out"
          done
          ls -la

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.run_number }}
          name: TachiyomiSY
          body: |
            <!-->
            > [!TIP]
            >
            > ### If you are unsure which version to download then go with `TachiyomiSY.apk`
          files: |
            TachiyomiSY.apk
            TachiyomiSY-arm64-v8a.apk
            TachiyomiSY-armeabi-v7a.apk
            TachiyomiSY-x86.apk
            TachiyomiSY-x86_64.apk
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
